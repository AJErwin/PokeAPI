<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Pokedex - Sistema de Acceso</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Fuente estilo Pokémon -->
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
        <style>
            body {
                margin: 0;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: 'Orbitron', sans-serif;

                /* Fondo diagonal tipo triángulo */
                background: linear-gradient(
                    135deg,
                    #ff1a1a 50%,
                    #ffffff 50%
                    );
            }

            /* Contenedor Pokebola */
            .pokeball-container {
                width: 520px;
                height: 520px;
                border-radius: 50%;
                background: linear-gradient(to bottom, #ff1a1a 50%, #ffffff 50%);
                position: relative;

                /* 🔥 BORDE NEGRO PARA DIFERENCIAR */
                border: 12px solid black;

                box-shadow:
                    0 20px 40px rgba(0,0,0,0.3);

                overflow: hidden;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            /* Brillo superior */
            .pokeball-container::before {
                content: "";
                position: absolute;
                width: 60%;
                height: 60%;
                top: 5%;
                left: 20%;
                background: radial-gradient(circle, rgba(255,255,255,0.4), transparent 70%);
                border-radius: 50%;
            }

            /* Línea negra central */
            .pokeball-divider {
                position: absolute;
                width: 100%;
                height: 18px;
                background: black;
                top: 50%;
                transform: translateY(-50%);
                z-index: 1;
            }

            /* Botón central */
            .pokeball-button {
                width: 120px;
                height: 120px;
                background: white;
                border-radius: 50%;
                border: 18px solid black;
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                box-shadow: 0 0 25px rgba(0,0,0,0.6);
            }

            .pokeball-button::after {
                content: "";
                position: absolute;
                width: 55px;
                height: 55px;
                background: #e6e6e6;
                border-radius: 50%;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
            }

            /* Sección superior (queda invisible pero mantiene estructura) */
            .top-section {
                position: absolute;
                top: 18%;
                text-align: center;
                z-index: 2;
                color: white;
            }

            .top-section h2 {
                margin: 0;
                font-weight: 700;
                letter-spacing: 2px;
            }

            .subtitle {
                font-size: 12px;
                opacity: 0.9;
            }

            /* Sección inferior login */
            .bottom-section {
                position: absolute;
                bottom: 15%;
                width: 300px;
                text-align: center;
                z-index: 2;
            }

            input {
                width: 100%;
                padding: 12px;
                margin-bottom: 12px;
                border-radius: 10px;
                border: 1px solid #ccc;
                font-size: 14px;
            }

            input:focus {
                outline: none;
                border: 2px solid #ff1a1a;
            }

            .btn-pokemon {
                width: 100%;
                padding: 12px;
                border-radius: 25px;
                border: none;
                font-weight: 600;
                cursor: pointer;
                margin-top: 5px;
                transition: 0.2s;
            }

            .btn-login {
                background: #ff1a1a;
                color: white;
            }

            .btn-login:hover {
                background: #cc0000;
            }

            .btn-register {
                background: black;
                color: white;
            }

            .btn-register:hover {
                background: #333;
            }

            .error-msg, .logout-msg {
                font-size: 12px;
                margin-bottom: 10px;
            }

            .error-msg {
                color: #b00000;
            }
            .logout-msg {
                color: #006600;
            }

        </style>
    </head>
    <body>

        <div class="pokeball-container">

            <div class="top-section">
                <h2>POKEDEX ACCESS</h2>
                <div class="subtitle">Centro Pokémon - Autenticación</div>
            </div>

            <div class="pokeball-divider">
                <div class="pokeball-button"></div>
            </div>

            <div class="bottom-section">

                <div th:if="${param.error}" class="error-msg">
                    ❌ Credenciales incorrectas
                </div>

                <div th:if="${param.logout}" class="logout-msg">
                    ✅ Sesión cerrada correctamente
                </div>

                <form th:action="@{/login}" method="post">
                    <input type="email" name="correo" class="form-control" placeholder="Correo electrónico" required autofocus>
                    <input type="password" name="password" class="form-control" placeholder="Contraseña" required>

                    <button type="submit" class="btn-pokemon btn-login">
                        Iniciar Sesión
                    </button>
                </form>

                <a th:href="@{/registro}" style="text-decoration: none;">
                    <button class="btn-pokemon btn-register">
                        Registrarse
                    </button>
                </a>

            </div>
        </div>

    </body>
</html>
