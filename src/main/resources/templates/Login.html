<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Pokedex - Sistema de Acceso</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

        <style>
            body{
                margin:0;
                height:100vh;
                display:flex;
                justify-content:center;
                align-items:center;
                font-family:'Orbitron', sans-serif;
                overflow:hidden;
                background: linear-gradient(135deg, #c40000 50%, #dcdcdc 50%);
            }

            /* 🔥 Pokeball */
            .pokeball{
                width:480px;
                height:480px;
                border-radius:50%;
                background: linear-gradient(to bottom, #ff1a1a 50%, #ffffff 50%);
                border:14px solid #000;
                position:relative;
                box-shadow:0 30px 60px rgba(0,0,0,0.45);
                display:flex;
                justify-content:center;
                align-items:center;
                flex-direction:column;
                transition: transform 1s ease;
            }

            .pokeball::before{
                content:"";
                position:absolute;
                width:100%;
                height:18px;
                background:#000;
                top:50%;
                transform:translateY(-50%);
                z-index:1;
            }

            .center-button{
                position:absolute;
                width:110px;
                height:110px;
                background:white;
                border-radius:50%;
                border:16px solid black;
                z-index:2;
                cursor:pointer;
                transition: transform 0.3s ease;
            }

            .center-button::after{
                content:"";
                position:absolute;
                width:45px;
                height:45px;
                background:#e6e6e6;
                border-radius:50%;
                top:50%;
                left:50%;
                transform:translate(-50%,-50%);
                box-shadow: inset 0 0 12px rgba(0,0,0,0.4);
            }

            .center-button:active{
                transform: scale(0.9);
            }

            .content{
                position:absolute;
                width:70%;
                z-index:3;
                display:none;
                flex-direction:column;
                align-items:center;
                justify-content:center;
                text-align:center;
            }

            .title{
                position:absolute;
                top:30px;
                color:white;
                text-shadow:2px 2px 4px rgba(0,0,0,0.6);
                opacity:0;
                transition: opacity 1s ease;
            }

            .title h2{
                margin:0;
                letter-spacing:2px;
                font-size:20px;
            }

            .subtitle{
                font-size:12px;
                opacity:.9;
                width:100%;
                text-align:center;
            }

            .form-area{
                margin-top:40px;
                width:100%;
            }

            input{
                width:100%;
                padding:12px;
                margin-bottom:14px;
                border-radius:14px;
                border:none;
                text-align:center;
                font-size:14px;
                box-shadow:0 5px 15px rgba(0,0,0,0.2);
            }

            input:focus{
                outline:none;
                box-shadow:0 0 10px #ff1a1a;
            }

            .btn{
                width:100%;
                padding:12px;
                border-radius:25px;
                border:none;
                font-weight:700;
                cursor:pointer;
                letter-spacing:1px;
                transition:.2s;
            }

            .btn-login{
                background:#ff1a1a;
                color:white;
                margin-bottom:10px;
            }

            .btn-login:hover{
                background:#b80000;
                transform:scale(1.03);
            }

            .btn-register{
                background:black;
                color:white;
            }

            .btn-register:hover{
                background:#222;
                transform:scale(1.03);
            }

            .rotate {
                animation: spin 1s linear forwards;
            }

            @keyframes spin{
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            @media(max-width:600px){
                .pokeball{
                    width:340px;
                    height:340px;
                }

                .center-button{
                    width:80px;
                    height:80px;
                    border-width:12px;
                }

                .center-button::after{
                    width:35px;
                    height:35px;
                }
            }
        </style>
    </head>

    <body>

        <div class="pokeball" id="pokeball">
            <div class="title" id="title">
                <h2>POKEDEX ACCESS</h2>
                <div class="subtitle">Centro Pokémon</div>
            </div>

            <div class="center-button" id="centerBtn"></div>

            <div class="content" id="content">
                <div class="form-area">
                    <form th:action="@{/login}" method="post">
                        <input type="email" name="correo" placeholder="Correo electrónico" required>
                        <input type="password" name="password" placeholder="Contraseña" required>
                        <button class="btn btn-login">Iniciar Sesión</button>
                    </form>

                    <a th:href="@{/registro}" style="text-decoration:none;">
                        <button class="btn btn-register">Registrarse</button>
                    </a>
                </div>
            </div>
        </div>

        <script>
            const centerBtn = document.getElementById('centerBtn');
            const pokeball = document.getElementById('pokeball');
            const content = document.getElementById('content');
            const title = document.getElementById('title');

            centerBtn.addEventListener('click', () => {
                pokeball.classList.add('rotate');

                setTimeout(() => {
                    content.style.display = 'flex';
                    title.style.opacity = 1;

                    pokeball.style.transition = 'transform 3s linear';
                    pokeball.style.transform = 'rotate(360deg)';
                }, 1000);
            });
        </script>

    </body>
</html>
