<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Pokedex - Sistema de Acceso</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

        <style>

            body{
                margin:0;
                height:100vh;
                display:flex;
                justify-content:center;
                align-items:center;
                font-family:'Orbitron', sans-serif;
                overflow:hidden;
            }

            /* 🔥 Fondo difuminado elegante */
            body::before{
                content:"";
                position:fixed;
                width:100%;
                height:100%;
                background: linear-gradient(
                    135deg,
                    #c40000 50%,
                    #dcdcdc 50%
                    );
                filter: blur(10px);
                transform: scale(1.1);
                z-index:-1;
            }

            /* Pokebola */
            .pokeball{
                width:480px;
                height:480px;
                border-radius:50%;
                background: linear-gradient(to bottom, #ff1a1a 50%, #ffffff 50%);
                border:14px solid #000;
                position:relative;
                box-shadow:0 30px 60px rgba(0,0,0,0.45);
                display:flex;
                justify-content:center;
                align-items:center;
            }

            .pokeball::before{
                content:"";
                position:absolute;
                width:100%;
                height:18px;
                background:#000;
                top:50%;
                transform:translateY(-50%);
                z-index:1;
            }

            .center-button{
                position:absolute;
                width:110px;
                height:110px;
                background:white;
                border-radius:50%;
                border:16px solid black;
                z-index:2;
            }

            .center-button::after{
                content:"";
                position:absolute;
                width:45px;
                height:45px;
                background:#e6e6e6;
                border-radius:50%;
                top:50%;
                left:50%;
                transform:translate(-50%,-50%);
                box-shadow: inset 0 0 12px rgba(0,0,0,0.4);
            }

            .content{
                position:absolute;
                width:70%;
                z-index:3;
                display:flex;
                flex-direction:column;
                align-items:center;
                justify-content:center;
                text-align:center;
            }

            .title{
                position:absolute;
                top:70px;
                color:white;
                text-shadow:2px 2px 4px rgba(0,0,0,0.6);
            }

            .title h2{
                margin:0;
                letter-spacing:2px;
                font-size:20px;
            }

            .subtitle{
                font-size:12px;
                opacity:.9;
                width:100%;
                text-align:center;
            }

            .form-area{
                margin-top:40px;
                width:100%;
            }

            input{
                width:100%;
                padding:12px;
                margin-bottom:14px;
                border-radius:14px;
                border:none;
                text-align:center;
                font-size:14px;
                box-shadow:0 5px 15px rgba(0,0,0,0.2);
            }

            input:focus{
                outline:none;
                box-shadow:0 0 10px #ff1a1a;
            }

            .btn{
                width:100%;
                padding:12px;
                border-radius:25px;
                border:none;
                font-weight:700;
                cursor:pointer;
                letter-spacing:1px;
                transition:.2s;
            }

            .btn-login{
                background:#ff1a1a;
                color:white;
                margin-bottom:10px;
            }

            .btn-login:hover{
                background:#b80000;
                transform:scale(1.03);
            }

            .btn-register{
                background:black;
                color:white;
            }

            .btn-register:hover{
                background:#222;
                transform:scale(1.03);
            }

            @media(max-width:600px){
                .pokeball{
                    width:340px;
                    height:340px;
                }
            }

        </style>
    </head>

    <body>

        <div class="pokeball">

            <div class="title">
                <h2>POKEDEX ACCESS</h2>
                <div class="subtitle">Centro Pokémon</div>
            </div>

            <div class="center-button"></div>

            <div class="content">

                <div class="form-area">

                    <form th:action="@{/login}" method="post">

                        <input type="email" name="correo" placeholder="Correo electrónico" required>

                        <input type="password" name="password" placeholder="Contraseña" required>

                        <button class="btn btn-login">Iniciar Sesión</button>

                    </form>

                    <a th:href="@{/registro}" style="text-decoration:none;">
                        <button class="btn btn-register">Registrarse</button>
                    </a>

                </div>
            </div>

        </div>

    </body>
</html>
