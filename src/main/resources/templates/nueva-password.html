<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Nueva contraseña</title>

        <style>

            body{
                margin:0;
                height:100vh;
                display:flex;
                justify-content:center;
                align-items:center;
                font-family:Courier New, monospace;

                background:
                    linear-gradient(135deg, rgba(255,0,0,0.15) 25%, transparent 25%) -50px 0,
                    linear-gradient(225deg, rgba(255,0,0,0.15) 25%, transparent 25%) -50px 0,
                    linear-gradient(315deg, rgba(255,255,255,0.25) 25%, transparent 25%),
                    linear-gradient(45deg, rgba(255,255,255,0.25) 25%, transparent 25%);
                background-size:100px 100px;
                background-color:#0b3d0b;
            }

            .pokeball{
                width:420px;
                height:420px;
                border-radius:50%;
                background:linear-gradient(to bottom,#d10000 50%, white 50%);
                border:10px solid black;
                position:relative;
            }

            .pokeball::before{
                content:"";
                position:absolute;
                width:100%;
                height:14px;
                background:black;
                top:50%;
                transform:translateY(-50%);
            }

            .center-button{
                width:120px;
                height:120px;
                background:white;
                border-radius:50%;
                border:10px solid black;
                position:absolute;
                top:50%;
                left:50%;
                transform:translate(-50%,-50%);
                z-index:1;
            }

            .top{
                position:absolute;
                top:60px;
                width:100%;
                text-align:center;
                color:white;
            }

            .form-center{
                position:absolute;
                top:50%;
                left:50%;
                transform:translate(-50%,-50%);
                text-align:center;
                z-index:3;
            }

            /* INPUT GROUP */

            .input-group{
                position:relative;
                margin-bottom:10px;
            }

            .input-group input{
                padding:12px;
                width:220px;
                border-radius:10px;
                border:2px solid black;
                text-align:center;
                padding-right:38px;
            }

            /* OJITO */

            .eye{
                position:absolute;
                right:10px;
                top:50%;
                transform:translateY(-50%);
                width:20px;
                height:20px;
                cursor:pointer;
                opacity:.7;
            }

            .eye:hover{
                opacity:1;
            }

            /* BOTON */

            button{
                padding:10px 20px;
                border:none;
                border-radius:10px;
                background:#ffcc00;
                font-weight:bold;
                cursor:pointer;
            }

            button:hover{
                background:#ffd633;
            }

            .error{
                color:red;
                font-size:12px;
            }

        </style>

        <script>

            function validarPassword() {

                let pass1 = document.getElementById("password").value;
                let pass2 = document.getElementById("confirmPassword").value;
                let mensaje = document.getElementById("mensaje");

                if (pass1.length < 8 || pass1.length > 12) {
                    mensaje.innerHTML = "La contraseña debe tener entre 8 y 12 caracteres";
                    return false;
                }

                if (pass1 !== pass2) {
                    mensaje.innerHTML = "Las contraseñas no coinciden";
                    return false;
                }

                return true;

            }

            function togglePassword(id) {

                const input = document.getElementById(id)

                if (input.type === "password") {
                    input.type = "text"
                } else {
                    input.type = "password"
                }

            }

        </script>

    </head>

    <body>

        <div class="pokeball">

            <div class="top">
                <h2>Nueva contraseña</h2>
            </div>

            <div class="center-button"></div>

            <div class="form-center">

                <form action="/restablecer-password" method="post" onsubmit="return validarPassword()">

                    <div class="input-group">
                        <input 
                            type="password" 
                            id="password"
                            name="password" 
                            placeholder="Nueva contraseña"
                            minlength="8"
                            maxlength="12"
                            required>

                        <svg onclick="togglePassword('password')" class="eye" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="black" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                        <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </div>

                    <div class="input-group">
                        <input 
                            type="password" 
                            id="confirmPassword"
                            placeholder="Confirmar contraseña"
                            minlength="8"
                            maxlength="12"
                            required>

                        <svg onclick="togglePassword('confirmPassword')" class="eye" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="black" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                        <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </div>

                    <div id="mensaje" class="error"></div>

                    <button type="submit">
                        Cambiar contraseña
                    </button>

                </form>

            </div>

        </div>

    </body>
</html>
