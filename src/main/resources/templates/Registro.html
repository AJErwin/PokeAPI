<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Pokedex - Registro</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Fuente estilo Pokémon -->
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

        <style>
            body {
                margin: 0;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: 'Orbitron', sans-serif;

                /* Fondo diagonal rojo/blanco */
                background: linear-gradient(
                    135deg,
                    #ff1a1a 50%,
                    #ffffff 50%
                    );
            }

            /* ============================= */
            /* POKEBOLA PRINCIPAL */
            /* ============================= */

            .pokeball-container {
                width: 520px;
                height: 520px;
                border-radius: 50%;
                background: linear-gradient(to bottom, #ff1a1a 50%, #ffffff 50%);
                position: relative;
                border: 12px solid black;
                box-shadow: 0 20px 40px rgba(0,0,0,0.3);
                overflow: hidden;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            /* Línea negra central */
            .pokeball-divider {
                position: absolute;
                width: 100%;
                height: 18px;
                background: black;
                top: 50%;
                transform: translateY(-50%);
                z-index: 1;
            }

            /* Botón central */
            .pokeball-button {
                width: 120px;
                height: 120px;
                background: white;
                border-radius: 50%;
                border: 18px solid black;
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                box-shadow: 0 0 25px rgba(0,0,0,0.6);
                z-index: 2;
            }

            .pokeball-button::after {
                content: "";
                position: absolute;
                width: 55px;
                height: 55px;
                background: #e6e6e6;
                border-radius: 50%;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
            }

            /* Contenedor del formulario */
            .form-wrapper {
                position: absolute;
                width: 320px;
                text-align: center;
                z-index: 3;
            }

            h2 {
                margin-bottom: 20px;
                color: black;
                letter-spacing: 1px;
            }

            input {
                width: 100%;
                padding: 12px;
                margin-bottom: 12px;
                border-radius: 10px;
                border: 1px solid #ccc;
                font-size: 14px;
            }

            input:focus {
                outline: none;
                border: 2px solid #ff1a1a;
            }

            .btn-pokemon {
                width: 100%;
                padding: 12px;
                border-radius: 25px;
                border: none;
                font-weight: 600;
                cursor: pointer;
                margin-top: 5px;
                transition: 0.2s;
            }

            .btn-login {
                background: #ff1a1a;
                color: white;
            }

            .btn-login:hover {
                background: #cc0000;
            }

            .btn-register {
                background: black;
                color: white;
            }

            .btn-register:hover {
                background: #333;
            }

            .success-msg {
                color: green;
                margin-bottom: 10px;
            }

            .error-msg {
                color: darkred;
                margin-bottom: 10px;
            }
        </style>
    </head>

    <body>

        <div class="pokeball-container">

            <div class="pokeball-divider"></div>
            <div class="pokeball-button"></div>

            <div class="form-wrapper">
                <h2>REGISTRO NUEVO ENTRENADOR</h2>

                <div th:if="${exito}" class="success-msg" th:text="${exito}"></div>
                <div th:if="${error}" class="error-msg" th:text="${error}"></div>

                <form th:action="@{/registro}" method="post">
                    <input type="text" name="username" placeholder="USUARIO" required autofocus>
                    <input type="email" name="correo" placeholder="CORREO" required>
                    <input type="password" name="password" placeholder="PASSWORD" required>

                    <button type="submit" class="btn-pokemon btn-login">
                        CREAR CUENTA
                    </button>
                </form>

                <a th:href="@{/login}" style="text-decoration: none;">
                    <button class="btn-pokemon btn-register" type="button">
                        VOLVER AL LOGIN
                    </button>
                </a>
            </div>

        </div>

    </body>
</html>
